<!doctype html>
<!--
  KINGO VOICE TA browser interface. Tool chips expose calls made during each
  turn. Starting a new conversation clears chat history but preserves saved
  weak concepts.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINGO VOICE TA</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --text: #e8eaf0; --dim: #8b90a0;
    --accent: #e4573d; --stt: #4e9af1; --llm: #b17ce8; --tts: #4ecf8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, sans-serif; padding: 2rem 1rem;
  }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 0 0 .25rem; }
  #status { color: var(--dim); min-height: 1.5em; margin-bottom: 1.5rem; }

  #ptt {
    width: 9rem; height: 9rem; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font: 600 1rem system-ui;
    cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
    transition: transform .1s, box-shadow .1s;
  }
  #ptt.recording { transform: scale(1.12); box-shadow: 0 0 0 12px rgba(228,87,61,.25); }
  #ptt:disabled { background: #3a3f4e; cursor: not-allowed; }

  .or { color: var(--dim); font-size: .8rem; margin: 1rem 0 .6rem; }
  #text-form { display: flex; width: 100%; max-width: 40rem; gap: .5rem; }
  #text-input {
    flex: 1; min-width: 0; border: 1px solid #3a3f4e; border-radius: 8px;
    background: var(--panel); color: var(--text); padding: .7rem .8rem; font: inherit;
  }
  #text-input:focus { outline: 2px solid var(--llm); outline-offset: 1px; }
  #text-send {
    border: none; border-radius: 8px; background: var(--llm); color: white;
    padding: .7rem 1rem; font: 600 .9rem system-ui; cursor: pointer;
  }
  #text-send:disabled, #text-input:disabled { opacity: .55; cursor: not-allowed; }

  #reset {
    margin-top: 1rem; background: none; border: 1px solid #3a3f4e; color: var(--dim);
    border-radius: 8px; padding: .35rem .9rem; font: 500 .85rem system-ui; cursor: pointer;
  }
  #reset:hover { color: var(--text); border-color: var(--dim); }

  #log { width: 100%; max-width: 40rem; margin-top: 2rem; }
  .turn { background: var(--panel); border-radius: 10px; padding: .8rem 1rem; margin-bottom: .8rem; }
  .turn .who { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .turn .err { color: #ff7a6b; white-space: pre-wrap; }

  /* tool chips: proof the model reached for a tool this turn */
  .tools { margin-top: .6rem; }
  .tools span {
    display: inline-block; font: 500 .75rem ui-monospace, monospace;
    background: rgba(78,207,138,.12); color: var(--tts);
    border: 1px solid rgba(78,207,138,.4); border-radius: 999px;
    padding: .15rem .6rem; margin-right: .4rem;
  }

  .lat { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-top: .6rem; }
  .lat span { display: block; }
  .lat .stt { background: var(--stt); } .lat .llm { background: var(--llm); }
  .lat .tts { background: var(--tts); } .lat .other { background: #555b6e; }
  .latlabel { font-size: .75rem; color: var(--dim); margin-top: .3rem; }
  .key { color: var(--dim); font-size: .75rem; margin-top: 1rem; }
  .key i { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin: 0 .3em 0 1em; }
</style>
</head>
<body>
  <h1>KINGO VOICE TA</h1>
  <div id="status">불러오는 중…</div>

  <button id="ptt">누르고<br>말하기</button>
  <div class="or">또는 텍스트로 테스트</div>
  <form id="text-form">
    <input id="text-input" name="text" maxlength="4000"
      placeholder="예: Self-Attention에서 Query와 Key를 왜 곱해?"
      aria-label="텍스트 질문">
    <button id="text-send" type="submit">전송</button>
  </form>
  <button id="reset" title="현재 대화 기록만 지웁니다">✕ 새 대화</button>
  <div class="key">
    지연 시간: <i style="background:var(--stt)"></i>STT
    <i style="background:var(--llm)"></i>Grok 및 tools
    <i style="background:var(--tts)"></i>TTS
    <i style="background:#555b6e"></i>network/other
  </div>

  <div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const status = (msg) => { $("status").textContent = msg; };

let recorder = null;
let chunks = [];
let recordRequested = false;

function setBusy(busy) {
  $("ptt").disabled = busy;
  $("text-input").disabled = busy;
  $("text-send").disabled = busy;
}

// Mic is initialized lazily so text-only testing never asks for permission.
async function initMic() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    status("마이크를 사용할 수 없습니다. 텍스트 입력은 계속 사용할 수 있습니다: " + e.message);
    return;
  }
  const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]
    .find((t) => MediaRecorder.isTypeSupported(t)) || "";
  recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = sendClip;

  status("마이크가 준비됐습니다. 버튼을 누른 채 말하세요.");
}

async function startRec() {
  if ($("ptt").disabled || !recordRequested) return;
  if (!recorder) await initMic();
  if (!recordRequested || !recorder || recorder.state === "recording") return;
  chunks = [];
  recorder.start();
  $("ptt").classList.add("recording");
  status("녹음 중… 전송하려면 버튼을 놓으세요.");
}
function stopRec() {
  if (!recorder || recorder.state !== "recording") return;
  recorder.stop();
  $("ptt").classList.remove("recording");
}
const requestRecording = async (event) => {
  event.preventDefault();
  recordRequested = true;
  await startRec();
};
const releaseRecording = () => {
  recordRequested = false;
  stopRec();
};
$("ptt").addEventListener("pointerdown", requestRecording);
$("ptt").addEventListener("pointerup", releaseRecording);
$("ptt").addEventListener("pointerleave", releaseRecording);
const isTyping = (target) =>
  target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable;
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && !isTyping(e.target)) requestRecording(e);
});
document.addEventListener("keyup", (e) => {
  if (e.code === "Space" && !isTyping(e.target)) releaseRecording();
});

// NEW this week: wipe the server-side conversation memory (Slide 19).
$("reset").addEventListener("click", async () => {
  await fetch("/reset", { method: "POST" });
  $("log").innerHTML = "";
  status("새 대화를 시작합니다. 저장된 취약 개념은 유지됩니다.");
  $("text-input").focus();
});

$("text-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const transcript = $("text-input").value.trim();
  if (!transcript) {
    status("텍스트 질문을 입력해 주세요.");
    $("text-input").focus();
    return;
  }

  setBusy(true);
  status("텍스트 질문을 처리하는 중…");
  const t0 = performance.now();
  try {
    const res = await fetch("/answer-text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: transcript }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "텍스트 요청에 실패했습니다.");

    addTurn({
      transcript: data.transcript,
      reply: data.reply,
      tools: data.tools,
      timings: data.timings,
      roundTrip: Math.round(performance.now() - t0),
    });
    $("text-input").value = "";
  } catch (e) {
    addTurn({ error: String(e) });
  } finally {
    setBusy(false);
    status("계속 질문하려면 음성 버튼을 누르거나 텍스트를 입력하세요.");
    $("text-input").focus();
  }
});

async function sendClip() {
  const clip = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  if (clip.size < 1000) { status("녹음이 너무 짧습니다. 버튼을 누른 채 말해 주세요."); return; }

  status("생각하는 중…");
  setBusy(true);
  const t0 = performance.now();

  try {
    const res = await fetch("/answer", { method: "POST", body: clip });
    const roundTrip = Math.round(performance.now() - t0);

    if (!res.ok) {
      addTurn({ error: await res.text() });
      return;
    }

    const timings = JSON.parse(res.headers.get("X-Timings") || "{}");
    const tools = JSON.parse(res.headers.get("X-Tools") || "[]");
    const transcript = maybeJson(res.headers.get("X-Transcript"));
    const reply = maybeJson(res.headers.get("X-Reply"));

    const audio = new Audio(URL.createObjectURL(await res.blob()));
    await audio.play();

    addTurn({ transcript, reply, tools, timings, roundTrip });
  } catch (e) {
    addTurn({ error: String(e) });
  } finally {
    setBusy(false);
    status("계속 질문하려면 음성 버튼을 누르거나 텍스트를 입력하세요.");
  }
}

const maybeJson = (h) => (h ? JSON.parse(h) : null);

function addTurn({ transcript, reply, tools = [], timings = {}, roundTrip, error }) {
  const div = document.createElement("div");
  div.className = "turn";

  if (error) {
    div.innerHTML = `<div class="who">서버 오류</div><div class="err"></div>`;
    div.querySelector(".err").textContent = error;
  } else {
    div.innerHTML = `
      <div class="who">나</div><div></div>
      <div class="who" style="margin-top:.5rem">KINGO VOICE TA</div><div></div>
      <div class="tools"></div>
      <div class="lat"></div><div class="latlabel"></div>`;
    const texts = div.querySelectorAll("div:not([class])");
    texts[0].textContent = transcript ?? "(인식된 음성 없음)";
    texts[1].textContent = reply ?? "";

    // Retrieval and persistence operations performed this turn.
    const toolsEl = div.querySelector(".tools");
    for (const t of tools) {
      const chip = document.createElement("span");
      chip.textContent = "🔧 " + t;
      toolsEl.appendChild(chip);
    }
    if (!tools.length) toolsEl.remove();

    const { stt = 0, llm = 0, tts = 0, recall = 0, pdf = 0, web = 0, grok = 0 } = timings;
    const other = Math.max(roundTrip - stt - llm - tts, 0);
    const bar = div.querySelector(".lat");
    for (const [cls, ms] of [["stt", stt], ["llm", llm], ["tts", tts], ["other", other]]) {
      const seg = document.createElement("span");
      seg.className = cls;
      seg.style.width = (100 * ms / Math.max(roundTrip, 1)) + "%";
      bar.appendChild(seg);
    }
    div.querySelector(".latlabel").textContent =
      `STT ${stt} ms · 검색 ${Math.max(recall, pdf) + web} ms · Grok ${grok || llm} ms · TTS ${tts} ms · 전체 ${roundTrip} ms`;
  }
  $("log").prepend(div);
}

status("텍스트를 입력하거나 음성 버튼을 눌러 질문하세요.");
$("text-input").focus();
</script>
</body>
</html>
